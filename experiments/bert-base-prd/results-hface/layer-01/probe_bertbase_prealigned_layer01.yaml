dataset:
  batch_size: 20
  corpus:
    dev_path: ptb3-wsj-dev.conllx
    root: /path/to/project-data/training-data/
    test_path: ptb3-wsj-test.conllx
    train_path: ptb3-wsj-train.conllx
  embeddings:
    dev_path: raw.dev.bertbase-natural-layers.hdf5
    root: /path/to/scratch/structural-probes-wip/Embeddings/Natural_sentences/BERTBase/
    test_path: raw.test.bertbase-natural-layers.hdf5
    train_path: raw.train.bertbase-natural-layers.hdf5
    type: subword
  observation_fieldnames:
  - index
  - sentence
  - lemma_sentence
  - upos_sentence
  - xpos_sentence
  - morph
  - head_indices
  - governance_relations
  - secondary_relations
  - extra_info
  - embeddings
model:
  alignment: pre-aligned
  alignment_dev_path: alignments.dev.hdf5
  alignment_root: /path/to/scratch/structural-probes-wip/Alignments/Natural_sentences/BERTBase/
  alignment_test_path: alignments.test.hdf5
  alignment_train_path: alignments.train.hdf5
  hidden_dim: 768
  model_layer: 1
  model_type: BERT-disk
  use_disk: true
probe:
  diagonal: false
  maximum_rank: 64
  params_path: predictor.params
  psd_parameters: true
  task_name: parse-distance
  task_signature: word_pair
probe_training:
  epochs: 40
  loss: L1
  report_uuas_during_training: true
reporting:
  observation_paths:
    dev_path: dev.observations
    test_path: test.observations
    train_path: train.observations
  prediction_paths:
    dev_path: dev.predictions
    test_path: test.predictions
    train_path: train.predictions
  reporting_methods:
  - spearmanr
  - uuas
  root: experiments/bert-base-prd/results-hface
