dataset:
  observation_fieldnames:
     - index
     - sentence
     - lemma_sentence
     - upos_sentence
     - xpos_sentence
     - morph
     - head_indices
     - governance_relations
     - secondary_relations
     - extra_info
     - embeddings
  corpus:
    root: PLACEHOLDER  # set from paths.yaml / paths.sh at submit time
    train_path: ptb3-wsj-train.conllx
    dev_path: ptb3-wsj-dev.conllx
    test_path: ptb3-wsj-test.conllx
  embeddings:
    type: subword
    root: PLACEHOLDER  # set from paths.yaml / paths.sh at submit time
    train_path: raw.train.roberta-shufflen1-layers.hdf5
    dev_path: raw.dev.roberta-shufflen1-layers.hdf5
    test_path: raw.test.roberta-shufflen1-layers.hdf5
  batch_size: 20
model:
  hidden_dim: 768
  model_type: roberta-disk
  use_disk: True
  model_layer: 0  # overridden per-layer by submit_train_probes.sh; 0=embedding, 1-12=transformer
probe:
  task_signature: word_pair
  task_name: parse-distance
  maximum_rank: 64
  psd_parameters: True
  diagonal: False
  params_path: predictor.params
probe_training:
  epochs: 40
  loss: L1
  report_uuas_during_training: True
reporting:
  root: experiments/roberta-shufflen1-prd/results  # overridden per-layer
  observation_paths:
    train_path: train.observations
    dev_path: dev.observations
    test_path: test.observations
  prediction_paths:
    train_path: train.predictions
    dev_path: dev.predictions
    test_path: test.predictions
  reporting_methods:
    - spearmanr
    - uuas
