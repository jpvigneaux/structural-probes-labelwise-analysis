<script>
(function() {
  var plot = document.querySelector('.plotly-graph-div');
  plot.on('plotly_hover', function(data) {
    var idx = data.points[0].curveNumber;
    var n   = plot.data.length;
    var updates = { 'line.width': [], 'opacity': [] };
    for (var i = 0; i < n; i++) {
      updates['line.width'].push(i === idx ? 3.0 : 1.0);
      updates['opacity'].push(i === idx ? 1.0 : 0.15);
    }
    Plotly.restyle(plot, updates);
  });
  plot.on('plotly_unhover', function() {
    var n = plot.data.length;
    var updates = { 'line.width': Array(n).fill(1.5), 'opacity': Array(n).fill(0.35) };
    Plotly.restyle(plot, updates);
  });
})();
</script>
